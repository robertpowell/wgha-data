name: Update Wordle Used Words

on:
  # Run daily at 1:00 AM UTC and 4:30 AM UTC (backup)
  schedule:
    - cron: '0 1 * * *'    # 1:00 AM UTC (primary)
    - cron: '30 4 * * *'   # 4:30 AM UTC (backup)

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  update-words:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run update script
        run: |
          python update-used-words.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code used-words.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Get new words before commit
        if: steps.git-check.outputs.changed == 'true'
        id: new-words
        run: |
          # Get words that were added
          NEW_WORDS=$(git diff used-words.json | grep '^+' | grep -v '^+++' | grep '"[A-Z]\{5\}"' | tr -d '+", ' | tr '\n' ' ')
          WORD_COUNT=$(echo "$NEW_WORDS" | wc -w | tr -d ' ')
          echo "words=$NEW_WORDS" >> $GITHUB_OUTPUT
          echo "count=$WORD_COUNT" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add used-words.json
          git commit -m "🤖 Auto-update used words - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Pushover notification on success
        if: success()
        run: |
          if [ "${{ steps.git-check.outputs.changed }}" == "true" ]; then
            MESSAGE="Added ${{ steps.new-words.outputs.count }} new words: ${{ steps.new-words.outputs.words }}"
          else
            MESSAGE="No new words added"
          fi
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_API_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=WGHA Words Updated" \
            --form-string "message=$MESSAGE" \
            --form-string "priority=-2" \
            https://api.pushover.net/1/messages.json

      - name: Report status
        run: |
          if [ -f used-words.json ]; then
            WORD_COUNT=$(python -c "import json; print(len(json.load(open('used-words.json'))))")
            echo "✅ Successfully updated! Total words: $WORD_COUNT"
          else
            echo "❌ Error: used-words.json not found"
            exit 1
          fi

      - name: Send Pushover notification on failure
        if: failure()
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_API_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=WGHA Update Failed" \
            --form-string "message=The Wordle used words update failed. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json
